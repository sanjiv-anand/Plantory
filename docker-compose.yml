services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lilylog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lilylog}"]
      interval: 5s
      timeout: 3s
      retries: 20

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - -m
      - ${LLM_MODEL_PATH:-/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -c
      - "${LLM_CONTEXT_SIZE:-2048}"
      - -np
      - "${LLM_PARALLEL:-1}"
      - --threads
      - "${LLM_THREADS:-4}"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MEDIA_URL: ${VITE_MEDIA_URL:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
    environment:
      APP_NAME: ${APP_NAME:-LILYLOG}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg:///lilylog?host=postgres&user=postgres}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:4173","http://localhost:5173"]}
      PHOTOS_ROOT: ${PHOTOS_ROOT:-/data/photos}
      PHOTOS_PUBLIC_BASE: ${PHOTOS_PUBLIC_BASE:-/media}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      THUMBNAIL_SIZE: ${THUMBNAIL_SIZE:-320}
      DISPLAY_MAX_WIDTH: ${DISPLAY_MAX_WIDTH:-1920}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-10}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      POSTGRES_DB: ${POSTGRES_DB:-lilylog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-LILYLOG}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:4173}
      STATIC_DIR: /app/static
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080}
      LLM_MODEL: ${LLM_MODEL:-qwen3-0.6b}
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf}
      LLM_MODEL_DISPLAY_NAME: ${LLM_MODEL_DISPLAY_NAME:-Qwen3-0.6B}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_HEALTH_TIMEOUT_SECONDS: ${LLM_HEALTH_TIMEOUT_SECONDS:-5}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-256}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.45}
      LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-1}
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
      AI_DAILY_SUMMARY_ENABLED: ${AI_DAILY_SUMMARY_ENABLED:-false}
      AI_STORY_ENABLED: ${AI_STORY_ENABLED:-true}
    ports:
      - "${GATEWAY_PORT:-4173}:8000"
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - photos_data:/data/photos
      - backups_data:/data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  photos_data:
  backups_data:
